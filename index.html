<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>مصحح الاختياري</title>
<meta name="theme-color" content="#27ae60">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon.png">
<style>
body{font-family:'Cairo',sans-serif;background:#f5f7fa;margin:0;padding:20px}
.container{max-width:600px;margin:auto;background:#fff;padding:20px;border-radius:12px;box-shadow:0 4px 12px rgba(0,0,0,.1)}
h1{color:#2c3e50;text-align:center}
label{display:block;margin:10px 0 5px;font-weight:bold}
input,textarea{width:100%;padding:10px;border:1px solid #ddd;border-radius:8px;font-size:16px}
button{width:100%;padding:12px;background:#27ae60;color:#fff;border:none;border-radius:8px;font-size:18px;margin-top:15px;cursor:pointer}
button:hover{background:#219150}
.result,.sub-box{margin-top:20px;padding:15px;background:#ecf0f1;border-radius:8px}
.sub-box{background:#fff3cd;border:1px solid #ffeeba;text-align:center}
.hidden{display:none}
.orange{color:#f47920;font-weight:bold}
</style>
</head>
<body>
<div class="container">

<div id="subBox" class="sub-box hidden">
<h3>الاشتراك منتهي</h3>
<p>جدد اشتراكك بـ <b>100 جنيه</b> شهرياً على <span class="orange">01289590022</span> أورانج كاش</p>
<p>وبعد الدفع ابعتلي واتساب هبعتلك كود التفعيل الجديد</p>
<input id="activateCode" placeholder="اكتب كود التفعيل هنا">
<button onclick="activate()">تفعيل</button>
</div>

<div id="appBox" class="hidden">
<h1>مصحح الاختياري</h1>
<label>الإجابة النموذجية A,B,C...</label>
<input id="answerKey" placeholder="A,B,D,C,A">
<label>إجابات الطلاب - كل طالب في سطر</label>
<textarea id="studentAnswers" rows="6" placeholder="أحمد: A,B,D,C,A&#10;محمد: A,C,D,B,A"></textarea>
<button onclick="correct()">صحح</button>
<div id="result" class="result" style="display:none"></div>
</div>

</div>

<script>
// غيّر الكود ده كل شهر
const ACTIVE_CODE = "OCT2025";

function checkSub(){
  const exp = localStorage.getItem('expDate');
  const today = new Date().getTime();

  if(exp && today < exp){
    document.getElementById('appBox').classList.remove('hidden');
  } else {
    document.getElementById('subBox').classList.remove('hidden');
  }
}

function activate(){
  const code = document.getElementById('activateCode').value.trim().toUpperCase();
  if(code === ACTIVE_CODE){
    const nextMonth = new Date();
    nextMonth.setDate(nextMonth.getDate() + 30);
    localStorage.setItem('expDate', nextMonth.getTime());
    alert('تم التفعيل بنجاح لمدة 30 يوم');
    location.reload();
  } else {
    alert('كود غير صحيح');
  }
}

function correct(){
  const key = document.getElementById('answerKey').value.toUpperCase().split(',').map(s=>s.trim());
  const students = document.getElementById('studentAnswers').value.split('\n');
  let html = '';

  students.forEach(line=>{
    if(!line.trim()) return;
    const [name, ans] = line.split(':');
    if(!ans) return;
    const studentAns = ans.toUpperCase().split(',').map(s=>s.trim());
    let score = 0;
    studentAns.forEach((a,i)=>{if(a===key[i]) score++});
    html += `<p><b>${name}</b>: ${score}/${key.length}</p>`;
  });

  document.getElementById('result').innerHTML = html;
  document.getElementById('result').style.display = 'block';
}

checkSub();

// تسجيل Service Worker للأوفلاين
if('serviceWorker' in navigator){
  navigator.serviceWorker.register('/sw.js');
}
</script>
</body>
</html>
